  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #000;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 60px 20px;
      text-align: center;
    }

    .logo {
      width: 180px;
      margin-bottom: 20px;
      transition: transform 0.25s ease;
    }

    .logo:hover {
      transform: scale(1.08);
    }

    h1 {
      font-size: 42px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.6);
    }

    .desc {
      margin-top: 10px;
      color: #fff;
      opacity: 0.95;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.7);
    }

    .buttons {
      margin-bottom: 40px;
    }

    .buttons a {
      text-decoration: none;
    }

    .buttons button {
      background: #000;
      border: 1px solid #333;
      color: #fff;
      padding: 14px 34px;
      margin: 6px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.25s ease;
    }

    .buttons button:hover {
      background: #111;
      transform: translateY(-3px) scale(1.05);
      border-color: #555;
    }

    .section-title {
      margin-bottom: 20px;
      font-size: 18px;
      color: #fff;
    }

    .game-card {
      background: #050505;
      border: 1px solid #111;
      border-radius: 12px;
      overflow: hidden;
      max-width: 360px;
      margin: auto;
      color: #fff;
      transition: all 0.25s ease;
    }

    .game-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: #111; /* remove green hover border */
    }

    .game-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: transform 0.25s ease;
    }

    .game-card:hover img {
      transform: scale(1.05);
    }

    .game-info {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }

    /* Green active badge */
    .badge {
      background: #22c55e;
      color: #000;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(34,197,94,0.6);
    }

    .indev {
      background: #facc15;
      box-shadow: 0 0 10px rgba(250,204,21,0.7);
    }

  </style>
</head>
<body>

    <span style="font-weight:600; font-size:18px; color:#fff; text-shadow:0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.6);">KOERU</span>
  </div>

  <div class="container">

    <img class="logo" src="https://files.catbox.moe/mg5wck.png" alt="logo">

    <div class="buttons">
      <a href="https://koeru.sellhub.cx/" target="_blank">
        <button>Purchase</button>
      </a>
      <a href="https://discord.gg/DyrCsxGrHZ" target="_blank">
        <button>Discord</button>
      </a>
    </div>

    <div class="section-title">Supported Roblox Games</div>

    <a href="https://www.roblox.com/games/6678877691/ZO-SAMURAI-SWORD-FIGHTING" target="_blank" style="text-decoration:none; color:inherit;">
    <div style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap;">

    <a href="https://www.roblox.com/games/6678877691/ZO-SAMURAI-SWORD-FIGHTING" target="_blank" style="text-decoration:none; color:inherit;">
      <div class="game-card">
        <img src="https://tr.rbxcdn.com/180DAY-b7d86235327561d4ee4e51b727d91f48/768/432/Image/Webp/noFilter" alt="game">
        <div class="game-info">
          <span>ZO SAMURAI SWORD FIGHTING</span>
          <span class="badge">UNDETECTED</span>
        </div>
      </div>
    </a>

    <a href="https://www.roblox.com/games/12625784503/Saber-Showdown" target="_blank" style="text-decoration:none; color:inherit;">

        <div class="game-info">
          <span>Saber Showdown</span>
          <span class="badge indev">Indev</span>
        </div>
      </div>
    </a>

    </div>

    <div class="section-title" style="margin-top:50px;">Colorbot/Triggerbot Supported Games</div>

    <div style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap;">

      <a href="https://playvalorant.com/" target="_blank" style="text-decoration:none; color:inherit;">
        <div class="game-card">
          <img src="https://xboxwire.thesourcemediaassets.com/sites/2/2024/08/Val-Console-Launch-Hero-1080-__-GAME-STORES-80b474d3ff38615edd0a-1900x1080.jpg" alt="valorant">
          <div class="game-info">
            <span>Valorant</span>
            <span class="badge indev">Indev</span>
          </div>
        </div>
      </a>

    </div>

  </div>

</body>
