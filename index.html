<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOERU</title>
  <link rel="icon" type="image/png" href="https://files.catbox.moe/5toruh.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #000;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 60px 20px;
      text-align: center;
    }

    .logo {
      width: 180px;
      margin-bottom: 20px;
      transition: transform 0.25s ease;
    }

    .logo:hover {
      transform: scale(1.08);
    }

    h1 {
      font-size: 42px;
      font-weight: 700;
      color: #fff;
    }

    .desc {
      margin-top: 10px;
      color: #fff;
      opacity: 0.9;
      margin-bottom: 15px;
    }

    .buttons {
      margin-bottom: 40px;
    }

    .buttons a {
      text-decoration: none;
    }

    .buttons button {
      background: #000;
      border: 1px solid #333;
      color: #fff;
      padding: 14px 34px;
      margin: 6px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.25s ease;
    }

    .buttons button:hover {
      background: #111;
      transform: translateY(-3px) scale(1.05);
      border-color: #555;
    }

    .section-title {
      margin-bottom: 20px;
      font-size: 18px;
      color: #fff;
    }

    .game-card {
      background: #050505;
      border: 1px solid #111;
      border-radius: 12px;
      overflow: hidden;
      max-width: 360px;
      margin: auto;
      color: #fff;
      transition: all 0.25s ease;
    }

    .game-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: #111; /* remove green hover border */
    }

    .game-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: transform 0.25s ease;
    }

    .game-card:hover img {
      transform: scale(1.05);
    }

    .game-info {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }

    /* Green active badge */
    .badge {
      background: #22c55e;
      color: #000;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(34,197,94,0.6); /* glow only on badge */
    }

  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div style="width:100%; background:#111; padding:10px 20px; display:flex; align-items:center;">
    <img src="https://files.catbox.moe/5toruh.png" style="width:28px; height:28px; margin-right:10px;">
    <span style="font-weight:600; font-size:18px;">KOERU</span>
  </div>

  <div class="container">

    <img class="logo" src="https://files.catbox.moe/mg5wck.png" alt="logo">

    <h1>KOERU</h1>
    <div class="desc">Surpass your limits NOW!</div>

    <div class="buttons">
      <a href="https://koeru.sellhub.cx/" target="_blank">
        <button>Purchase</button>
      </a>
      <button>Discord</button>
    </div>

    <div class="section-title">Supported Game</div>

    <a href="https://www.roblox.com/games/6678877691/ZO-SAMURAI-SWORD-FIGHTING" target="_blank" style="text-decoration:none; color:inherit;">
    <div class="game-card">
      <img src="https://tr.rbxcdn.com/180DAY-b7d86235327561d4ee4e51b727d91f48/768/432/Image/Webp/noFilter" alt="game">
      <div class="game-info">
        <span>ZO SAMURAI SWORD FIGHTING</span>
        <span class="badge">Active</span>
      </div>
    </a>

  </div>

</body>
</html>

</body>
</html>
