<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KOERU</title>

  <!-- TAB ICON -->
  <link rel="icon" type="image/png" href="/images/Koeru2.png">

  <!-- DISCORD EMBED -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="KOERU">
  <meta property="og:description" content="Surpass your limits NOW!">
  <meta property="og:url" content="https://koeruontop.vercel.app/">

  <!-- IMPORTANT -->
  <meta property="og:image" content="https://koeruontop.vercel.app/images/Koeru3.png">

  <meta name="theme-color" content="#d9d9d9">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="KOERU">
  <meta name="twitter:description" content="Surpass your limits NOW!">

  <!-- IMPORTANT -->
  <meta name="twitter:image" content="https://koeruontop.vercel.app/images/Koeru3.png">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 60px 20px;
      text-align: center;
    }

    /* TOP BAR */

    .topbar {
      width: 100%;
      background: #111;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1a1a1a;
    }

    .top-left {
      display: flex;
      align-items: center;
    }

    .top-left img {
      width: 28px;
      height: 28px;
      margin-right: 10px;
    }

    .top-left span {
      font-weight: 600;
      font-size: 18px;
      color: #fff;
      text-shadow:
        0 0 10px rgba(255,255,255,0.9),
        0 0 20px rgba(255,255,255,0.6);
    }

    .top-buttons {
      display: flex;
      gap: 12px;
      margin-right: 35px;
    }

    .top-buttons a {
      text-decoration: none;
    }

    .top-buttons button {
      background: #000;
      border: 1px solid #222;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 14px;
    }

    .top-buttons button:hover {
      background: #0f0f0f;
      transform: translateY(-2px);
      box-shadow: 0 0 10px rgba(255,255,255,0.08);
    }

    /* MAIN */

    .logo {
      width: 220px;
      margin-bottom: 20px;
      transition: transform 0.25s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    h1 {
      font-size: 52px;
      font-weight: 700;
      color: #fff;
      text-shadow:
        0 0 10px rgba(255,255,255,0.9),
        0 0 20px rgba(255,255,255,0.6);
    }

    .desc {
      margin-top: 10px;
      color: #fff;
      opacity: 0.95;
      margin-bottom: 22px;
      font-size: 20px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.9),
        0 0 20px rgba(255,255,255,0.7);
    }

    /* BUTTONS */

    .buttons {
      margin-bottom: 45px;
    }

    .buttons a {
      text-decoration: none;
    }

    .buttons button {
      background: #000;
      border: 1px solid #333;
      color: #fff;
      padding: 15px 34px;
      margin: 6px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.25s ease;
    }

    .buttons button:hover {
      background: #111;
      transform: translateY(-3px) scale(1.03);
      border-color: #555;
      box-shadow: 0 0 12px rgba(255,255,255,0.08);
    }

    /* SECTION */

    .section-title {
      margin-bottom: 22px;
      margin-top: 15px;
      font-size: 20px;
      color: #fff;
      font-weight: 600;
    }

    .games {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* GAME CARD */

    .game-card {
      background: #050505;
      border: 1px solid #111;
      border-radius: 14px;
      overflow: hidden;
      width: 340px;
      color: #fff;
      transition: all 0.25s ease;
    }

    .game-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: #1d1d1d;
      box-shadow: 0 0 20px rgba(255,255,255,0.04);
    }

    .game-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: transform 0.25s ease;
    }

    .game-card:hover img {
      transform: scale(1.05);
    }

    .game-info {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }

    /* BADGES */

    .badge {
      background: #22c55e;
      color: #000;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(34,197,94,0.5);
    }

    .indev {
      background: #facc15;
      color: #000;
      box-shadow: 0 0 10px rgba(250,204,21,0.5);
    }

    /* FOOTER */

    .footer {
      margin-top: 60px;
      padding: 20px;
      text-align: center;
      color: #777;
      font-size: 14px;
      border-top: 1px solid #111;
    }

    /* MOBILE */

    @media (max-width: 768px) {

      .top-buttons {
        gap: 8px !important;
        margin-right: 10px !important;
      }

      .top-buttons button {
        padding: 7px 12px !important;
        font-size: 12px !important;
        border-radius: 8px !important;
      }

      h1 {
        font-size: 40px;
      }

      .desc {
        font-size: 17px;
      }

      .logo {
        width: 180px;
      }

      .buttons button {
        width: 90%;
        max-width: 300px;
      }

      .game-card {
        width: 100%;
      }

    }

  </style>
</head>

<body>

  <!-- TOPBAR -->

  <!-- MAIN -->

    </div>

         style="text-decoration:none; color:inherit;">

        <div class="game-card">

          <img src="https://xboxwire.thesourcemediaassets.com/sites/2/2024/08/Val-Console-Launch-Hero-1080-__-GAME-STORES-80b474d3ff38615edd0a-1900x1080.jpg">

          <div class="game-info">
            <span>Valorant</span>
            <span class="badge indev">Indev</span>
          </div>

        </div>

      </a>

    </div>

  </div>

  <!-- FOOTER -->

  <div class="footer">
    © 2026 KOERU. All rights reserved.
  </div>

</body>
</html>
